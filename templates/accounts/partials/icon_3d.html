{% comment %}Former clay icon — now renders the shared flat icon tile.
Expects: icon, optional tone (1-7), size (sm|lg), float, extra_class{% endcomment %}
<span
  class="icon-tile icon-tile--{{ tone|default:1 }}{% if size %} icon-tile--{{ size }}{% endif %}{% if float %} icon-tile--float{% endif %}{% if extra_class %} {{ extra_class }}{% endif %}"
  aria-hidden="true"
>
  <svg class="icon-flat__glyph" aria-hidden="true"><use href="#i-{{ icon|default:'folder' }}"/></svg>
</span>
