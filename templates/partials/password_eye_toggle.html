<button
  type="button"
  class="password-field__toggle js-password-toggle"
  data-target="{{ target }}"
  aria-label="Show password"
  aria-pressed="false"
>
  <svg class="password-field__icon password-field__icon--show" viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true">
    <path d="M2 12s3.5-6.5 10-6.5S22 12 22 12s-3.5 6.5-10 6.5S2 12 2 12Z" stroke="currentColor" stroke-width="1.7"/>
    <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.7"/>
  </svg>
  <svg class="password-field__icon password-field__icon--hide" viewBox="0 0 24 24" width="18" height="18" fill="none" aria-hidden="true" hidden>
    <path d="M3 3l18 18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M10.6 10.7a3 3 0 0 0 4.2 4.2" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
    <path d="M9.9 5.6A10.5 10.5 0 0 1 12 5.5C18.5 5.5 22 12 22 12a18.6 18.6 0 0 1-3.1 3.9M6.1 6.2A18.4 18.4 0 0 0 2 12s3.5 6.5 10 6.5c1.1 0 2.1-.2 3-.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
  </svg>
</button>
