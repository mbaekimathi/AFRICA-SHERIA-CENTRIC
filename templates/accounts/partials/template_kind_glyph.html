{# Small glyph for a template's court/office classification. Expects: kind (court|office) #}
<span class="docs-kind__glyph docs-kind__glyph--{{ kind|default:'office' }}" aria-hidden="true">
  {% if kind == "court" %}
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
    <path d="M12 4v16M6.5 20h11" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    <path d="M4 9.5h6.5L7.25 15 4 9.5ZM13.5 9.5H20L16.75 15 13.5 9.5Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
    <path d="M4.5 7.5 12 5.5l7.5 2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  </svg>
  {% else %}
  <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
    <path d="M6 20V5.5A1.5 1.5 0 0 1 7.5 4h6A1.5 1.5 0 0 1 15 5.5V20" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M15 10h2.5A1.5 1.5 0 0 1 19 11.5V20" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/>
    <path d="M4 20h16M9 8h3M9 11.5h3M9 15h3" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
  </svg>
  {% endif %}
</span>
