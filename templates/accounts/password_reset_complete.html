{% extends "base.html" %}

{% block title %}Password Reset Complete — Sheria-Centric{% endblock %}
{% block body_class %}auth-page{% endblock %}

{% block content %}
<main class="auth-shell auth-shell--single">
  <section class="auth-panel">
    <div class="auth-card">
      <header class="auth-card__header">
        <h1>Password updated</h1>
        <p>Your employee account password has been reset successfully.</p>
      </header>
      <a class="btn btn--primary" href="{% url 'accounts:login' %}">Sign in</a>
    </div>
  </section>
</main>
{% endblock %}
