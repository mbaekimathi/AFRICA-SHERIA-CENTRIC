<button
  type="button"
  class="profile-trigger"
  id="profile-trigger"
  aria-haspopup="menu"
  aria-expanded="false"
  aria-controls="profile-dropdown"
>
  {% if actor.profile_photo %}
  <img class="avatar avatar--xs" src="{{ actor.profile_photo.url }}" alt="">
  {% else %}
  <div class="avatar avatar--xs avatar--placeholder" aria-hidden="true">
    {% if actor.first_name or actor.last_name %}
    {{ actor.first_name|slice:":1"|upper }}{{ actor.last_name|slice:":1"|upper }}
    {% else %}
    {{ actor.get_full_name|slice:":2"|upper }}
    {% endif %}
  </div>
  {% endif %}
  <span class="profile-trigger__text">
    <span class="profile-trigger__name">{{ actor.get_full_name|default:actor.login_code }}</span>
    <span class="profile-trigger__meta">{{ role_label }}</span>
  </span>
  <svg class="profile-caret" viewBox="0 0 20 20" width="14" height="14" aria-hidden="true">
    <use href="#i-caret"/>
  </svg>
</button>
