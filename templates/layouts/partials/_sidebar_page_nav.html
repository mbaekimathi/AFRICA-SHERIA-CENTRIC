{% for item in page_nav_items %}
<a
  href="{% if item.disabled %}#{% else %}{{ item.url }}{% endif %}"
  class="nav-link {% if item.active %}is-active{% endif %}{% if item.disabled %} is-disabled{% endif %}{% if item.badge_count %} has-unread{% endif %}"
  {% if item.badge_count %}aria-label="{{ item.label }}, {{ item.badge_count }} pending"{% endif %}
  {% if item.disabled %}aria-disabled="true" tabindex="-1" title="{{ item.title|default:nav_lock_title }}"{% endif %}
  {% if item.external and not item.disabled %}target="_blank" rel="noopener noreferrer"{% endif %}
>
  <span class="nav-icon-wrap">
    <span class="nav-icon" aria-hidden="true">{{ item.icon|safe }}</span>
    <span
      class="nav-badge"
      data-page-badge="{{ item.slug }}"
      {% if not item.badge_count %}hidden{% endif %}
    >{{ item.badge_count|default:0 }}</span>
  </span>
  <span>
    {{ item.label }}
    {% if item.disabled %}<em class="nav-soon">{{ nav_lock_label }}</em>{% endif %}
  </span>
</a>
{% endfor %}
