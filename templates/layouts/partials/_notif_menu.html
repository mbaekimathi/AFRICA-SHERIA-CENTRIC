<div
  class="notif-menu"
  id="notif-menu"
  data-notifications-url="{{ notifications_url }}"
  data-mark-all-url="{{ notifications_mark_all_url }}"
  data-sound-enabled="{% if notification_sound_enabled %}true{% else %}false{% endif %}"
  data-sound-volume="{{ notification_sound_volume|default:70 }}"
  data-browser-enabled="{% if notification_browser_enabled %}true{% else %}false{% endif %}"
  data-firm-name="{{ firm_name|default:'Sheria Centric' }}"
>
  {% csrf_token %}
  <button
    type="button"
    class="icon-btn notif-trigger{% if notification_unread_count %} has-unread is-ringing{% endif %}"
    id="notif-trigger"
    aria-haspopup="true"
    aria-expanded="false"
    aria-controls="notif-dropdown"
    aria-label="{% if notification_unread_count %}Notifications, {{ notification_unread_count }} unread{% else %}Notifications{% endif %}"
  >
    <span class="notif-trigger__bell" aria-hidden="true">
      <svg viewBox="0 0 24 24" width="18" height="18" fill="none">
        <use href="#i-bell"/>
      </svg>
    </span>
    <span class="notif-badge" id="notif-badge" {% if not notification_unread_count %}hidden{% endif %}>{{ notification_unread_count|default:0 }}</span>
  </button>

  <div class="notif-dropdown" id="notif-dropdown" hidden>
    <div class="notif-dropdown__head">
      <p class="notif-dropdown__title">Notifications</p>
      <button type="button" class="notif-mark-all" id="notif-mark-all" {% if not notification_unread_count %}hidden{% endif %}>
        Mark all read
      </button>
    </div>
    <div class="notif-dropdown__body" id="notif-list" aria-live="polite">
      <p class="notif-empty">Loading…</p>
    </div>
  </div>
</div>
